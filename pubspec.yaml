name: pokedex
description: "pokedex"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Gestión de estado e Inyección de dependencias
  flutter_riverpod: ^3.5.0

  # Persistencia local (Drift y SQLite)
  drift: 2.35.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Cliente GraphQL con Ferry
  ferry: ^0.16.1+2
  ferry_flutter: ^0.9.1+1
  gql_http_link: ^1.2.0

  # Monitoreo de conectividad
  connectivity_plus: ^7.3.2

  # Enrutamiento declarativo
  go_router: ^18.1.3

  # Caché de imágenes offline
  cached_network_image: ^4.0.6
  flutter_localizations:
    sdk: flutter
  drift_flutter: 0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de código para Drift y Ferry
  drift_dev: 2.35.2
  ferry_generator: ^0.12.0+6
  build_runner: 2.16.2